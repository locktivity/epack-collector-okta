name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  collector:
    uses: locktivity/epack/.github/workflows/collector-ci.yaml@9b831a2a1b77bf54aa9d320db8dbd67476441a65 # v0.8.1
    with:
      name: okta
      profile-url: ${{ vars.EVIDENCE_PROFILE_URL }}
      conformance-secrets: OKTA_API_TOKEN OKTA_PRIVATE_KEY
      checks: |
        ./scripts/check-forbidden-data.sh
