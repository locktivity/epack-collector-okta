name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  collector:
    uses: locktivity/epack/.github/workflows/collector-ci.yaml@c8cf0c52ec071e051001176eb38aacd4f28c1f92 # v0.9.3
    with:
      name: okta
      profile-url: ${{ vars.EVIDENCE_PROFILE_URL }}
      conformance-secrets: OKTA_API_TOKEN OKTA_PRIVATE_KEY
      checks: |
        ./scripts/check-forbidden-data.sh
