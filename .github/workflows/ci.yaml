name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  collector:
    uses: locktivity/epack/.github/workflows/collector-ci.yaml@3d9fa4ce2f034ec65240abffa97eb5d7f3a3e234 # v0.9.0
    with:
      name: okta
      profile-url: ${{ vars.EVIDENCE_PROFILE_URL }}
      conformance-secrets: OKTA_API_TOKEN OKTA_PRIVATE_KEY
      checks: |
        ./scripts/check-forbidden-data.sh
